<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir Rahimian</title>
    <meta name="description" content="Portfolio of Amir Hossein Rahimian">
    <meta name="keywords" content="Amir Rahimian, Portfolio, Android Developer, UI UX Designer, Yazd">
    <meta property="og:title" content="Amir Rahimian Portfolio">
    <meta property="og:description" content="Android development, UI/UX design, AI studies, and product projects.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amir-rahimian.github.io/">
    <meta property="og:image" content="https://amir-rahimian.github.io/assets/img/portfolioIcon.png">
    <link rel="icon" type="image/png" href="assets/img/portfolioIcon.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="application/ld+json" id="person-schema"></script>
</head>
<body dir="rtl">
    <div class="background-layer" aria-hidden="true">
        <div class="background-orb orb-one"></div>
        <div class="background-orb orb-two"></div>
        <div class="background-grid"></div>
    </div>

    <div class="page-layer">
        <header class="topbar-layer">
            <nav class="topbar" id="navbar" aria-label="Primary">
                <a href="#home" class="brand" id="brand-link">
                    <img src="assets/img/portfolioIcon.png" alt="Amir Rahimian logo" class="brand-logo">
                    <div class="brand-copy">
                        <strong id="brand-name">Amir Rahimian</strong>
                        <span id="brand-role">Android Developer</span>
                    </div>
                </a>

                <div class="topbar-center">
                    <div class="nav-links" id="nav-links"></div>
                </div>

                <div class="topbar-actions">
                    <a class="glass-button primary-button" id="resume-link" href="#" target="_blank" rel="noopener">Resume</a>
                    <div class="lang-switch" aria-label="Language switcher">
                        <button class="lang-btn" type="button" data-lang="en">EN</button>
                        <button class="lang-btn" type="button" data-lang="fa">FA</button>
                    </div>
                </div>
            </nav>
        </header>

        <main class="page-content">
            <section class="hero-section glass-panel" id="home">
                <div class="hero-visual">
                    <div class="portrait-frame">
                        <div class="portrait-ring"></div>
                        <img src="assets/img/face.png" alt="Amir Hossein Rahimian portrait" class="hero-portrait">
                        <div class="photo-badges" id="photo-badges"></div>
                    </div>
                </div>
                <div class="hero-copy">
                    <p class="section-kicker" id="hero-kicker"></p>
                    <h1 class="hero-title" id="hero-title"></h1>
                    <p class="hero-role" id="hero-role"></p>
                    <p class="hero-summary" id="hero-summary"></p>
                    <div class="hero-facts" id="hero-facts"></div>
                    <div class="hero-actions">
                        <a href="#projects" class="glass-button primary-button" id="hero-primary-action"></a>
                        <a href="#contact" class="glass-button" id="hero-secondary-action"></a>
                    </div>
                </div>
            </section>

            <section class="content-grid-section">
                <aside class="sidebar-stack" id="skills">
                    <div id="sidebar-content"></div>
                </aside>

                <div class="main-stack">
                    <section class="section-panel" id="education">
                        <div class="section-heading">
                            <p class="section-kicker" id="education-kicker"></p>
                            <h2 id="education-title"></h2>
                            <p class="section-description" id="education-description"></p>
                        </div>
                        <div class="education-rail" id="education-list"></div>
                    </section>

                    <section class="section-panel" id="employment">
                        <div class="section-heading">
                            <p class="section-kicker" id="employment-kicker"></p>
                            <h2 id="employment-title"></h2>
                            <p class="section-description" id="employment-description"></p>
                        </div>
                        <div class="timeline" id="employment-list"></div>
                    </section>

                    <section class="section-panel" id="projects">
                        <div class="section-heading">
                            <p class="section-kicker" id="projects-kicker"></p>
                            <h2 id="projects-title"></h2>
                            <p class="section-description" id="projects-description"></p>
                        </div>
                        <div class="project-timeline" id="projects-list"></div>
                    </section>
                </div>
            </section>

            <section class="contact-section glass-panel" id="contact">
                <div class="contact-copy">
                    <p class="section-kicker" id="contact-kicker"></p>
                    <h2 id="contact-title"></h2>
                    <p class="section-description" id="contact-description"></p>
                    <div class="contact-actions" id="contact-actions"></div>
                </div>

                <div class="contact-card">
                    <div class="contact-card-top">
                        <p class="contact-label" id="contact-card-label"></p>
                        <h3 id="contact-card-title"></h3>
                        <p class="contact-card-text" id="contact-card-text"></p>
                    </div>
                    <form class="contact-form" id="contactForm">
                        <label class="field">
                            <span id="label-name"></span>
                            <input class="form-input" type="text" id="name" name="name" required>
                        </label>
                        <label class="field">
                            <span id="label-email"></span>
                            <input class="form-input" type="email" id="email" name="email" required>
                        </label>
                        <label class="field">
                            <span id="label-message"></span>
                            <textarea class="form-input textarea-input" id="message" name="message" rows="5" required></textarea>
                        </label>
                        <button class="glass-button primary-button submit-button" type="submit" id="submit-button"></button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p id="footer-copy"></p>
        </footer>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
