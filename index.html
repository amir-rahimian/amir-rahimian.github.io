<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir Rahimian</title>
    <meta name="description" content="Portfolio of Amir Hossein Rahimian">
    <meta name="keywords" content="Amir Rahimian, Portfolio, Android Developer, UI UX Designer, Yazd">
    <meta property="og:title" content="Amir Rahimian Portfolio">
    <meta property="og:description" content="Android development, UI/UX design, AI studies, and product projects.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amir-rahimian.github.io/">
    <meta property="og:image" content="https://amir-rahimian.github.io/assets/img/portfolioIcon.png">
    <link rel="icon" type="image/webp" href="assets/img/portfolioIcon.webp">
    <link rel="preload" href="assets/img/face.webp" as="image" fetchpriority="high">
    <link rel="preload" href="assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://visitor-badge.laobi.icu" crossorigin>
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="application/ld+json" id="person-schema"></script>
    <script data-goatcounter="https://amirrahimian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body dir="rtl">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="background-layer" aria-hidden="true">
        <div class="background-orb orb-one"></div>
        <div class="background-orb orb-two"></div>
    </div>

    <div class="page-layer">
        <header class="topbar-layer">
            <nav class="topbar" id="navbar" aria-label="Primary">
                <a href="#home" class="brand" id="brand-link">
                    <img src="assets/img/portfolioIcon.webp" alt="Amir Rahimian logo" class="brand-logo">
                    <div class="brand-copy">
                        <strong id="brand-name">Amir Rahimian</strong>
                        <span id="brand-role">Android Developer</span>
                    </div>
                </a>

                <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation"
                    aria-controls="nav-links" aria-expanded="false">
                    <span></span>
                    <span></span>
                </button>
                <div class="topbar-center">
                    <div class="nav-links" id="nav-links"></div>
                </div>
                <img src="https://visitor-badge.laobi.icu/badge?page_id=amir-rahimian&left_text=%E2%80%8C&left_color=%23595959&right_color=%231283c3&logo=github&radius=5"
                    alt="visitor badge" width="72" height="24" loading="lazy" decoding="async"
                    referrerpolicy="no-referrer">
                <div class="topbar-actions">
                    <details class="resume-menu" id="resume-menu">
                        <summary class="glass-button primary-button resume-trigger">
                            <span class="resume-trigger-label" id="resume-trigger-label"></span>
                            <span class="resume-trigger-icon" aria-hidden="true">↓</span>
                        </summary>
                        <div class="resume-options" id="resume-options" role="group">
                            <a class="resume-link" id="resume-full-link" href="#" target="_blank" rel="noopener">
                                <span class="resume-link-label"></span>
                                <span class="resume-size">5.2 MB</span>
                            </a>
                            <a class="resume-link" id="resume-eco-link" href="#" target="_blank" rel="noopener">
                                <span class="resume-link-label"></span>
                                <span class="resume-size">1.7 MB</span>
                            </a>
                        </div>
                    </details>
                    <div class="lang-switch" role="group" aria-label="Language switcher">
                        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
                        <button class="lang-btn" type="button" data-lang="fa" aria-pressed="false">FA</button>
                    </div>
                </div>
            </nav>
        </header>

        <main class="page-content" id="main-content">
            <section class="hero-section" id="home">
                <div class="hero-visual">
                    <div class="hero-portrait-frame">
                        <img src="assets/img/face.webp" alt="Amir Hossein Rahimian portrait" class="hero-portrait"
                            id="hero-portrait" fetchpriority="high" decoding="async">
                    </div>
                    <div class="hero-badges" id="hero-badges"></div>
                </div>
                <div class="hero-copy">
                    <p class="section-kicker" id="hero-kicker"></p>
                    <h1 class="hero-title" id="hero-title"></h1>
                    <p class="hero-role" id="hero-role"></p>
                    <p class="hero-summary" id="hero-summary"></p>
                    <div class="hero-actions">
                        <a href="#projects" class="glass-button primary-button" id="hero-primary-action"></a>
                        <a href="#contact" class="glass-button" id="hero-secondary-action"></a>
                    </div>
                </div>
            </section>

            <section class="content-grid-section">
                <aside class="sidebar-stack" id="skills">
                    <div id="sidebar-content"></div>
                    <section class="section-panel sidebar-education" id="education">
                        <div class="section-heading">
                            <p class="section-kicker" id="education-kicker"></p>
                            <h2 id="education-title"></h2>
                            <p class="section-description" id="education-description"></p>
                        </div>
                        <div class="education-rail" id="education-list"></div>
                    </section>
                </aside>

                <div class="main-stack">
                    <section class="section-panel" id="employment">
                        <div class="section-heading">
                            <p class="section-kicker" id="employment-kicker"></p>
                            <h2 id="employment-title"></h2>
                            <p class="section-description" id="employment-description"></p>
                        </div>
                        <div class="timeline" id="employment-list"></div>
                    </section>

                    <section class="section-panel" id="projects">
                        <div class="section-heading">
                            <p class="section-kicker" id="projects-kicker"></p>
                            <h2 id="projects-title"></h2>
                            <p class="section-description" id="projects-description"></p>
                        </div>
                        <div class="project-timeline" id="projects-list"></div>
                    </section>
                </div>
            </section>

            <section class="contact-section" id="contact">
                <div class="contact-backdrop" aria-hidden="true">
                    <img src="assets/img/face-animated.webp?v=2" alt="" loading="lazy" decoding="async"
                        fetchpriority="low">
                </div>
                <div class="contact-copy">
                    <p class="section-kicker" id="contact-kicker"></p>
                    <h2 id="contact-title"></h2>
                    <p class="section-description" id="contact-description"></p>
                    <div class="contact-actions" id="contact-actions"></div>
                </div>

                <div class="contact-card">
                    <div class="contact-card-top">
                        <p class="contact-label" id="contact-card-label"></p>
                        <h3 id="contact-card-title"></h3>
                        <p class="contact-card-text" id="contact-card-text"></p>
                    </div>
                    <form class="contact-form" id="contactForm">
                        <label class="field">
                            <span id="label-name"></span>
                            <input class="form-input" type="text" id="name" name="name" required>
                        </label>
                        <label class="field">
                            <span id="label-email"></span>
                            <input class="form-input" type="email" id="email" name="email" required>
                        </label>
                        <label class="field">
                            <span id="label-message"></span>
                            <textarea class="form-input textarea-input" id="message" name="message" rows="5"
                                required></textarea>
                        </label>
                        <button class="glass-button primary-button submit-button" type="submit"
                            id="submit-button"></button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p id="footer-copy"></p>

        </footer>
    </div>

    <div class="lightbox" id="project-lightbox" hidden>
        <div class="lightbox-shell" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
            <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close">×</button>
            <button class="lightbox-arrow lightbox-arrow--prev" type="button" data-lightbox-step="-1"
                aria-label="Previous image">‹</button>
            <figure class="lightbox-figure">
                <img class="lightbox-image" id="lightbox-image" alt="">
                <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
            </figure>
            <button class="lightbox-arrow lightbox-arrow--next" type="button" data-lightbox-step="1"
                aria-label="Next image">›</button>
        </div>
    </div>
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
